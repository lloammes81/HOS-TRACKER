name: Auto-merge claude branch to main

on:
  push:
    branches:
      - 'claude/**'

# Permisos para fusionar a main Y desplegar a GitHub Pages en el mismo job.
# El deploy va aquí (y no en deploy.yml por separado) porque el push a main lo
# hace este workflow con GITHUB_TOKEN, y GitHub NO dispara otros workflows desde
# pushes hechos con GITHUB_TOKEN — por eso Pages quedaba congelado en una
# versión vieja. Este workflow sí corre (lo dispara el push real a claude/**).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --ff-only origin/${{ github.ref_name }} || git merge -X theirs origin/${{ github.ref_name }}
          git push origin main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
